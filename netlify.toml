[build]
  # No build step needed — dashboard is pre-generated
  command = "echo 'Dashboard deployed'"
  publish = "."

[dev]
  command = "python3 -m http.server 8000"
  port = 8000

# Root redirects to auth
[[redirects]]
  from = "/"
  to = "/auth.html"
  status = 200

# Catch-all for SPA
[[redirects]]
  from = "/*"
  to = "/auth.html"
  status = 200

[context.production]
  # Production: use index.html as-is
  command = "echo 'Production deployment'"

[context.deploy-preview]
  # Deploy preview: same
  command = "echo 'Preview deployment'"
