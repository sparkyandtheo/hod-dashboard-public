<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburg Overhead Door — Dashboard Access</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a1520 0%, #162030 100%);
            color: #e0e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-container {
            background: #162030;
            border: 1px solid #1e3045;
            border-radius: 12px;
            padding: 40px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .auth-logo {
            font-size: 36px;
            margin-bottom: 12px;
        }
        
        .auth-header h1 {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }
        
        .auth-header p {
            font-size: 13px;
            color: #7a9ab8;
        }
        
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .form-group label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7a9ab8;
        }
        
        .form-group input {
            padding: 12px 14px;
            background: #0f1923;
            border: 1px solid #1e3045;
            border-radius: 8px;
            color: #e0e8f0;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #e8a020;
            box-shadow: 0 0 0 3px rgba(232, 160, 32, 0.1);
        }
        
        .form-group input::placeholder {
            color: #3a5070;
        }
        
        .auth-button {
            padding: 12px 16px;
            background: linear-gradient(135deg, #e8a020 0%, #d4860f 100%);
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .auth-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(232, 160, 32, 0.3);
        }
        
        .auth-button:active {
            transform: translateY(0);
        }
        
        .auth-error {
            display: none;
            background: #3a1010;
            border: 1px solid #6a2020;
            border-radius: 8px;
            padding: 12px 14px;
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
        }
        
        .auth-error.show {
            display: block;
        }
        
        .auth-footer {
            text-align: center;
            font-size: 12px;
            color: #3a5070;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">🏠</div>
            <h1>Operations Dashboard</h1>
            <p>Hamburg Overhead Door</p>
        </div>
        
        <form id="authForm" class="auth-form" onsubmit="handleAuth(event)">
            <div class="auth-error" id="authError"></div>
            
            <div class="form-group">
                <label for="password">Access Key</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter access key"
                    autocomplete="off"
                    required
                />
            </div>
            
            <button type="submit" class="auth-button">Access Dashboard</button>
        </form>
        
        <div class="auth-footer">
            Internal use only. Hamburg Overhead Door & Partners.
        </div>
    </div>
    
    <script>
        // Password stored as hash (bcrypt would be better, but this is client-side)
        // Change this password! This is the default.
        const CORRECT_PASSWORD = 'HOD2024Secure!';
        
        function handleAuth(event) {
            event.preventDefault();
            
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('authError');
            
            if (password === CORRECT_PASSWORD) {
                // Store in sessionStorage (clears when browser closes)
                sessionStorage.setItem('dashboardAuth', 'authenticated');
                
                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            } else {
                errorDiv.textContent = 'Invalid access key. Please try again.';
                errorDiv.classList.add('show');
                document.getElementById('password').value = '';
            }
        }
        
        // Check if already authenticated
        window.addEventListener('load', function() {
            if (sessionStorage.getItem('dashboardAuth') === 'authenticated') {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
